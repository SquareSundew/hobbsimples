<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armário Fortnite</title>
<style>
:root{--bg:#0b1020;--p:#141b34;--l:#232c4d;--tx:#e8ecff;--m:#8b95c0;--ac:#4cc3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Segoe UI,sans-serif}
button,select,input{font:inherit;color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--l)}
h1{font-size:20px;margin:0;display:flex;align-items:center}h1 b{color:var(--ac)}
.logo{height:38px;width:auto;max-width:200px;object-fit:contain;display:block}
.sw{position:relative;flex:1;min-width:220px;max-width:560px}
#q{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--l);background:var(--p);outline:none}
#q:focus{border-color:var(--ac)}
#sg{position:absolute;left:0;right:0;top:44px;background:var(--p);border:1px solid var(--l);border-radius:10px;overflow:hidden;display:none;box-shadow:0 12px 30px #0008}
#sg div{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}#sg div:hover{background:var(--l)}
#sg img{width:30px;height:30px;border-radius:6px}#sg small{color:var(--m);margin-left:auto}
.seg{display:flex;border:1px solid var(--l);border-radius:10px;overflow:hidden}
.seg button,#cats button,#rars button{background:var(--p);border:0;padding:8px 12px;cursor:pointer}
.seg button.on,#cats button.on{background:var(--ac);color:#04121c;font-weight:600}
#cats{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
#cats button{border-radius:20px;border:1px solid var(--l)}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:12px 18px}
#rars{display:flex;gap:6px;flex-wrap:wrap}
#rars button{border-radius:8px;border:1px solid var(--l);border-left:4px solid var(--c,var(--l))}
#rars button.on{background:var(--c,var(--ac));color:#000;font-weight:600}
#rars small,#cats small{opacity:.7;margin-left:4px}
.sel{display:flex;gap:8px;flex-wrap:wrap}
select{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:8px}
#info{padding:0 18px 8px;color:var(--m)}
#info button{background:var(--l);border:0;border-radius:12px;padding:3px 10px;cursor:pointer;margin-left:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 18px 20px}
.c{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 35%,var(--c),#0b1020 85%);border:2px solid var(--c);transition:transform .15s}
.c:hover{transform:translateY(-4px) scale(1.02)}
.c img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.c .n{padding:8px;background:#000a;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .t{position:absolute;top:6px;left:6px;background:#000b;border-radius:6px;padding:2px 6px;font-size:11px}
.c .f{position:absolute;top:6px;right:6px;font-size:14px;text-shadow:0 0 4px #000}
#more{height:40px}
#md,#cm,#mp{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:10;padding:14px}
#md[hidden],#cm[hidden],#mp[hidden]{display:none}
.box{background:var(--p);border:1px solid var(--l);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.box .im{background:radial-gradient(circle,var(--c),#0b1020);display:flex;align-items:center}
.box .im img{width:100%;display:block}
.box.wide{grid-template-columns:1fr;max-width:960px}
#bgl{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;filter:blur(var(--blur,0px));transform:scale(1.08)}
#bgl::after{content:"";position:absolute;inset:0;background:rgba(5,8,18,var(--dim,.65))}
#cfg,#mapb{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:8px 12px;cursor:pointer}
#mpb{max-width:860px}
.mapimg{display:block;width:100%;border-radius:10px;border:1px solid var(--l)}
.cbox{background:var(--p);border:1px solid var(--l);border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:260px;overflow:auto;margin-bottom:8px}
.pi{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.pi.sel{border-color:var(--ac)}
header{background:rgba(11,16,32,var(--ga,.93));-webkit-backdrop-filter:blur(var(--gb,8px));backdrop-filter:blur(var(--gb,8px))}
select.hid,#cats{display:none}
.dd{position:relative}
.dd>button{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:150px;padding:8px 12px;border-radius:8px;border:1px solid var(--l);cursor:pointer;background:rgba(20,27,52,var(--ga,1));-webkit-backdrop-filter:blur(var(--gb,0px));backdrop-filter:blur(var(--gb,0px))}
.dd>button::after{content:"▾";opacity:.7;transition:transform .15s}
.dd.open>button{border-color:var(--ac)}
.dd.open>button::after{transform:rotate(180deg)}
.dl{position:absolute;right:0;top:calc(100% + 6px);min-width:100%;width:max-content;max-width:min(320px,88vw);max-height:340px;overflow:auto;background:rgba(14,20,40,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--l);border-radius:12px;padding:6px;box-shadow:0 18px 44px #000b;z-index:20;display:none}
.dd.open .dl{display:block}
.dl div{padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.dl div:hover{background:var(--l)}
.dl div.cur{background:var(--ac);color:#04121c;font-weight:600}
.dl div.dh{margin-top:6px;padding:12px 12px 4px;border-top:1px solid var(--l);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);cursor:default}
.dl div.dh:hover{background:none}
#shop{display:none;padding:0 18px 24px}
body.shop #shop{display:block}
body.shop #grid,body.shop #more,body.shop .bar,body.shop #cats{display:none}
#shop h3{margin:18px 0 10px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c .pr{background:#000a;padding:0 8px 8px;font-weight:600;font-size:13px}
.sty{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;margin:4px 0 10px}
.sq{width:52px;height:52px;padding:0;border:2px solid var(--l);border-radius:8px;overflow:hidden;background:var(--bg);cursor:pointer}
.sq.on{border-color:var(--ac)}
.sq.r{width:50px;height:62px}
.box .im.rn{align-items:flex-end}
.sq.r img{object-fit:contain}
.sq img{width:100%;height:100%;object-fit:cover;display:block}
.vb,.c img.vb{height:14px;width:auto;aspect-ratio:auto;object-fit:contain;display:inline-block;vertical-align:-2px;margin-right:3px}
:root{color-scheme:dark}
select option,select optgroup{background:#141b34;color:#e8ecff}
select option:checked{background:#2a6df4;color:#fff}
#q,.seg button,#cats button:not(.on),#rars button:not(.on),select,#cfg,#mapb{background:rgba(20,27,52,var(--ga,1));-webkit-backdrop-filter:blur(var(--gb,0px));backdrop-filter:blur(var(--gb,0px))}
.box .tx{padding:20px}.box h2{margin:0 0 6px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;color:#000;font-weight:700;font-size:12px;background:var(--c)}
.row{margin:8px 0;color:var(--m)}.row b{color:var(--tx);font-weight:500}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.act button{background:var(--l);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.act button.on{background:var(--ac);color:#04121c}
.lk{background:0;border:0;color:var(--ac);cursor:pointer;padding:0;text-decoration:underline}
@media(max-width:600px){.box{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bgl"></div>
<header>
  <h1><img class="logo" src="https://cms-assets.unrealengine.com/AVzjeqAbLRKi3W5jq0CAvz/ovBnvmuJSxO5xtgXZcef" alt="Fortnite" onerror="this.replaceWith('Armário Fortnite')"></h1>
  <div class="sw"><input id="q" type="search" placeholder="Buscar skin, picareta, set, capítulo…  ( / )" autocomplete="off"><div id="sg"></div></div>
  <div class="seg" id="col"><button data-v="all" class="on">Todos</button><button data-v="own">Vestiário <small id="no"></small></button><button data-v="fav">Favoritos</button><button data-v="shop">Loja</button></div>
  <button id="mapb" title="Mapa do jogo">Mapa</button>
  <button id="cfg" title="Configurações">⚙️</button>
</header>
<nav id="cats"></nav>
<section class="bar"><div id="rars"></div>
  <div class="sel"><select id="type"></select><select id="chap"></select>
    <select id="sort"><option value="rel">Relevância / novos</option><option value="name">Nome (A–Z)</option><option value="new">Mais recentes</option><option value="rar">Raridade ↓</option></select></div>
</section>
<div id="info">Carregando cosméticos…</div>
<main id="grid"></main><div id="more"></div>
<div id="shop"></div>
<div id="md" hidden><div class="box" id="box"></div></div>
<div id="cm" hidden><div class="cbox" id="cb"></div></div>
<div id="mp" hidden><div class="cbox" id="mpb"></div></div>

<script>
const API='https://fortnite-api.com/v2/cosmetics?language=pt-BR';
/* RENDERS 3D: coloque as imagens numa pasta "renders" ao lado deste arquivo, nomeadas com o ID do item
   (ex.: renders/CID_028_Athena_Commando_F.png). Se o arquivo não existir, usa a imagem da API.
   Para usar um link externo, troque por: id=>'https://seu-link/'+id+'.png'. Use null para desativar. */
const RENDER_URL=id=>'renders/'+id+'.png';
/* Arte completa das telas de carregamento (aparece no botão "Ver arte completa" da janela). */
/* Tipos que NÃO aparecem no menu "Todos os tipos" (acrescente ou remova nomes à vontade). */
const HIDE_TYPES=new Set(['Aura','Beans','Boost','Car Body','Character','Chassi','Construção','Decal','Fazer Gesto','Gesto Embutido','Gesto IA do Iron Man','LEGO','MASCOTE','Meio de transporte favorito de Grievous.','Música','Pacote de Música','Pacotão de Decoração','Personagem','Rastro de Fumaça','Roda','Sem Acessório para as Costas','Serviço','Spray de Teste','Trail','Turbo','Visual','Wheels','null'].map(s=>s.toLowerCase()));
const SPRAY_URL=id=>'https://fortnite-api.com/images/cosmetics/br/'+id.toLowerCase()+'/decal.png';
const LS_BG=id=>'https://fortnite-api.com/images/cosmetics/br/'+id.toLowerCase()+'/background.png';
const CAT={br:'Battle Royale',instruments:'Instrumentos',cars:'Carros',tracks:'Faixas',lego:'LEGO',legoKits:'Kits LEGO',beans:'Beans'};
const RAR={common:['Comum','#b1b1b1'],uncommon:['Incomum','#60aa3a'],rare:['Raro','#49acf2'],epic:['Épico','#b15be2'],legendary:['Lendário','#e98b3a'],mythic:['Mítico','#f2c744'],transcendent:['Transcendente','#ff5c8a']};
const RANK=Object.keys(RAR);
const SER={marvelseries:'#ed1d24',dcseries:'#548bd1',creatorcollabseries:'#2de0d8',shadowseries:'#8a8a8a',slurpseries:'#1fc7d3',frozenseries:'#9bd6f5',lavaseries:'#e8602c',platformseries:'#7a52d6',columbusseries:'#f0c33c',cubeseries:'#a62be0'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ld=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch{return new Set()}};
const sv=(k,s)=>{try{localStorage.setItem(k,JSON.stringify([...s]))}catch{}};
let ITEMS=[],V=[],T=[],shown=0,cur=-1;const BY=new Map();
const own=ld('fn_own'),fav=ld('fn_fav');
const S={q:'',cat:'br',rar:'all',type:'all',chap:'all',set:'',sort:'rel',col:'all'};

function mk(o,cat){
  const img=o.images?.icon||o.images?.smallIcon||o.images?.large||o.images?.small||o.albumArt||'';
  if(!img||!o.id)return null;
  const r=(o.rarity?.value||'common').toLowerCase();
  const sk=(o.series?.backendValue||'').toLowerCase();
  const it={id:o.id,cat,name:o.name||o.title||o.id,desc:o.description||(o.artist?'Artista: '+o.artist:''),
    type:o.type?.displayValue||CAT[cat],r:RAR[r]?r:'common',rn:o.rarity?.displayValue||RAR[r]?.[0]||'Comum',
    set:o.set?.value||'',series:o.series?.value||'',intro:o.introduction?.text||'',
    chap:o.introduction?.chapter?'Capítulo '+o.introduction.chapter:'',added:o.added||'',
    img,big:/^LoadingScreen/i.test(o.id)?img:(o.images?.featured||img),r3d:RENDER_URL&&!/^LoadingScreen/i.test(o.id)?RENDER_URL(o.id):'',
    bg:/^LoadingScreen/i.test(o.id)?LS_BG(o.id):(/^Spray_/i.test(o.id)||o.type?.value==='spray')?SPRAY_URL(o.id):'',
    wide:/^LoadingScreen/i.test(o.id),tv:o.type?.value||'',ch:o.introduction?.chapter||'',se:o.introduction?.season||'',
    vars:vOf(o)};
  it.col=SER[sk]||RAR[it.r][1];
  it.nn=norm(it.name);
  it.blob=norm([it.name,it.desc,it.type,it.rn,it.set,it.series,it.intro,it.chap,it.id].join(' '));
  return it;
}

/* cache dos cosméticos no navegador (IndexedDB): só a primeira visita baixa tudo */
const IDB={
  db:()=>new Promise((ok,no)=>{const r=indexedDB.open('fn_cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),
  async get(k){try{const d=await this.db();return await new Promise(ok=>{const t=d.transaction('k').objectStore('k').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(null)})}catch{return null}},
  async set(k,v){try{const d=await this.db();await new Promise(ok=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok();t.onabort=()=>ok()})}catch{}}
};
async function load(){
  $('#info').textContent='Carregando cosméticos…';
  try{
    let d=null;const old=await IDB.get('cos');
    if(old&&old.d&&Date.now()-old.t<432e5)d=old.d;
    else{
      if(!old)$('#info').textContent='Carregando cosméticos… (a primeira vez demora; depois fica guardado no navegador)';
      try{d=(await(await fetch(API)).json()).data;if(d)IDB.set('cos',{t:Date.now(),d})}
      catch(e){if(old&&old.d)d=old.d;else throw e}
    }
    ITEMS=[];
    for(const k in CAT)if(Array.isArray(d[k]))d[k].forEach(o=>{const it=mk(o,k);if(it){ITEMS.push(it);BY.set(it.id,it)}});
    const ch=[...new Set(ITEMS.map(i=>i.chap).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));
    $('#chap').innerHTML='<option value="all">Todos os capítulos</option>'+ch.map(c=>`<option>${c}</option>`).join('');
    buildTypes();update();applyBg();setTimeout(preloadShop,2000);
  }catch(e){
    $('#info').innerHTML='Não foi possível carregar a API (abra o arquivo no navegador, com internet). <button onclick="load()">Tentar de novo</button>';
  }
}

const FEST=new Set(['baixo','bateria','baterias','guitarra','keytar','microfone','faixas']);
function buildTypes(){
  const ts=[...new Set(ITEMS.filter(i=>S.cat==='all'||i.cat===S.cat||(S.cat==='br'&&i.cat==='instruments')).map(i=>i.type))].filter(t=>!HIDE_TYPES.has(t.toLowerCase())).sort();
  const op=t=>`<option>${esc(t)}</option>`;
  const br=ts.filter(t=>!FEST.has(t.toLowerCase())).sort((a,b)=>(b.toLowerCase()==='traje')-(a.toLowerCase()==='traje')).map(op),fe=ts.filter(t=>FEST.has(t.toLowerCase())).map(op);
  if(S.cat==='br'&&ITEMS.some(i=>i.cat==='tracks')&&!fe.some(o=>o.includes('>Faixas<')))fe.push('<option value="__tracks">Faixas</option>');
  $('#type').innerHTML='<option value="all">Todos os tipos</option>'+(S.cat==='tracks'?'<option value="__br">← Voltar aos itens</option>':'')+
    (br.length?`<optgroup label="Battle Royale">${br.join('')}</optgroup>`:'')+
    (fe.length?`<optgroup label="Fortnite Festival">${fe.join('')}</optgroup>`:'');
  $('#type').value=S.type='all';
}

function match(it,skip){
  if(skip!=='cat'&&S.cat!=='all'&&!(it.cat===S.cat||(S.cat==='br'&&it.cat==='instruments')))return false;
  if(skip!=='rar'&&S.rar!=='all'&&it.r!==S.rar)return false;
  if(S.type!=='all'&&it.type!==S.type)return false;
  if(S.chap!=='all'&&it.chap!==S.chap)return false;
  if(S.set&&it.set!==S.set)return false;
  if(S.col==='own'&&!own.has(it.id))return false;
  if(S.col==='fav'&&!fav.has(it.id))return false;
  return T.every(t=>it.blob.includes(t));
}
const score=it=>it.nn.startsWith(norm(S.q).trim())?0:it.nn.includes(norm(S.q).trim())?1:2;

function update(){
  document.body.classList.toggle('shop',S.col==='shop');
  if(S.col==='shop'){V=[];renderShop();return}
  T=norm(S.q).split(/\s+/).filter(Boolean);
  const cc={},rc={};let all=0;
  for(const it of ITEMS){
    if(match(it,'cat')){cc[it.cat]=(cc[it.cat]||0)+1;all++}
    if(match(it,'rar'))rc[it.r]=(rc[it.r]||0)+1;
  }
  $('#cats').innerHTML=`<button data-c="all" class="${S.cat==='all'?'on':''}">Tudo<small>${all}</small></button>`+
    Object.keys(CAT).filter(k=>cc[k]||S.cat===k).map(k=>`<button data-c="${k}" class="${S.cat===k?'on':''}">${CAT[k]}<small>${cc[k]||0}</small></button>`).join('');
  $('#rars').innerHTML=`<button data-r="all" class="${S.rar==='all'?'on':''}">Todas</button>`+
    RANK.filter(r=>rc[r]||S.rar===r).map(r=>`<button data-r="${r}" style="--c:${RAR[r][1]}" class="${S.rar===r?'on':''}">${RAR[r][0]}<small>${rc[r]||0}</small></button>`).join('');
  V=ITEMS.filter(i=>match(i));
  const by=S.sort;
  V.sort((a,b)=>by==='name'?a.name.localeCompare(b.name,'pt'):
    by==='rar'?RANK.indexOf(b.r)-RANK.indexOf(a.r)||a.name.localeCompare(b.name,'pt'):
    by==='new'?(b.added>a.added?1:-1):
    (T.length?score(a)-score(b):0)||(b.added>a.added?1:-1));
  $('#no').textContent=own.size?`(${own.size})`:'';
  $('#info').innerHTML=`${V.length} itens`+(S.set?` · Set: <b>${esc(S.set)}</b> <button onclick="S.set='';update()">✕</button>`:'');
  $('#grid').innerHTML='';shown=0;more();
}

const card=it=>`<article class="c" data-id="${esc(it.id)}" style="--c:${it.col}"><img loading="lazy" src="${esc(it.img)}" alt=""><span class="t">${esc(it.type)}</span><span class="f">${own.has(it.id)?'✅':''}${fav.has(it.id)?'⭐':''}</span><div class="n" title="${esc(it.name)}">${esc(it.name)}</div></article>`;
function more(){
  if(shown>=V.length)return;
  const end=Math.min(shown+60,V.length);
  $('#grid').insertAdjacentHTML('beforeend',V.slice(shown,end).map(card).join(''));shown=end;
}
new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:'600px'}).observe($('#more'));

/* sugestões inteligentes */
function suggest(){
  const sg=$('#sg'),q=norm(S.q).trim();
  if(q.length<2){sg.style.display='none';return}
  const ts=q.split(/\s+/);
  const names=ITEMS.filter(i=>ts.every(t=>i.nn.includes(t))).sort((a,b)=>(a.nn.startsWith(q)?0:1)-(b.nn.startsWith(q)?0:1)).slice(0,6);
  const sets=new Map();
  ITEMS.forEach(i=>{if(i.set&&ts.every(t=>norm(i.set).includes(t)))sets.set(i.set,(sets.get(i.set)||0)+1)});
  const h=names.map(i=>`<div data-open="${esc(i.id)}"><img src="${esc(i.img)}" alt="">${esc(i.name)}<small>${esc(i.rn)}</small></div>`).join('')+
    [...sets].slice(0,3).map(([s,n])=>`<div data-set="${esc(s)}">📦 Set: ${esc(s)}<small>${n} itens</small></div>`).join('');
  sg.innerHTML=h;sg.style.display=h?'block':'none';
}

/* modal */
function open(i){
  cur=V.findIndex(x=>x.id===i);const it=BY.get(i);if(!it)return;
  const bx=$('#box');bx.style.setProperty('--c',it.col);const ub=!!(it.bg&&art);bx.className='box'+(ub&&it.wide?' wide':'');
  const rr=ub?[]:(RMAP.get(it.id)||[]),vs=SHOW_STYLES?(it.vars||[]):[],o0=ub?it.bg:(rr[0]||it.r3d||it.big);
  const pk=[...BMAP.values()].filter(x=>x.i.includes(it.id)).sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,3);

    const o=JSON.parse(await f.text());if(o.app!=='armario-fortnite')throw 0;
    const arr=x=>Array.isArray(x)?x.filter(i=>typeof i==='string'):[];
    arr(o.vestiario).forEach(i=>own.add(i));arr(o.favoritos).forEach(i=>fav.add(i));
    Object.entries(o.renders||{}).forEach(([k,v])=>{if(Array.isArray(v)&&v.length&&v.every(u=>typeof u==='string'&&/^https:\/\//.test(u))&&(!RMAP.has(k)||RMAP.get(k).length<v.length))RMAP.set(k,v)});
    Object.entries(o.precos||{}).forEach(([k,v])=>{if(v&&typeof v.p==='number'&&(!PMAP.has(k)||String(v.d||'')>String(PMAP.get(k).d||'')))PMAP.set(k,{p:v.p,r:typeof v.r==='number'?v.r:v.p,d:String(v.d||'')})});
    const c=o.config||{};
    if(['dark','ls','rand'].includes(c.mode))CFG.mode=c.mode;
    if(typeof c.id==='string')CFG.id=c.id;
    for(const [k,lo,hi] of [['dim',0,.95],['blur',0,24],['gb',0,30],['ga',.2,1]])if(typeof c[k]==='number')CFG[k]=Math.min(hi,Math.max(lo,c[k]));
    sv('fn_own',own);sv('fn_fav',fav);saveMaps();saveCfg();applyBg();syncCfg();update();
    msg.textContent=`Importado: ${own.size} no vestiário, ${fav.size} favoritos, ${RMAP.size} renders e ${PMAP.size} preços.`;
  }catch{msg.textContent='Esse arquivo não é um backup válido do armário.'}
  $('#cmf').value='';
}
$('#cfg').onclick=openCfg;
$('#cm').addEventListener('click',e=>{
  if(e.target.id==='cm'||e.target.closest('[data-x]')){closeCfg();return}
  if(e.target.closest('[data-exp]')){expo();return}
  if(e.target.closest('[data-imp]')){$('#cmf').click();return}
  const m=e.target.closest('[data-m]');
  if(m){CFG.mode=m.dataset.m;saveCfg();syncCfg();applyBg();return}
  const p=e.target.closest('.pi');
  if(p){CFG.id=p.dataset.id;CFG.mode='ls';saveCfg();syncCfg();applyBg();renderPick($('#cms').value)}
});
$('#cm').addEventListener('change',e=>{if(e.target.id==='cmf')impo(e.target.files[0])});
$('#cm').addEventListener('input',e=>{
  if(e.target.id==='cms')renderPick(e.target.value);
  if(e.target.id==='cmd'){CFG.dim=e.target.value/100;saveCfg();syncCfg();applyVars()}
  if(e.target.id==='cmb'){CFG.blur=+e.target.value;saveCfg();syncCfg();applyVars()}
  if(e.target.id==='cgb'){CFG.gb=+e.target.value;saveCfg();syncCfg();applyVars()}
  if(e.target.id==='cga'){CFG.ga=e.target.value/100;saveCfg();syncCfg();applyVars()}
});
/* menus suspensos próprios (substituem a lista nativa do navegador) */
const closeDD=()=>document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));
function makeDD(sel){
  const w=document.createElement('div');w.className='dd';
  const b=document.createElement('button');b.type='button';b.innerHTML='<span></span>';
  const l=document.createElement('div');l.className='dl';
  sel.classList.add('hid');sel.after(w);w.append(b,l);
  const sync=()=>{
    const o=sel.options[sel.selectedIndex];b.firstElementChild.textContent=o?o.textContent:'';
    const row=o=>`<div data-i="${o.index}" class="${o.index===sel.selectedIndex?'cur':''}">${esc(o.textContent)}</div>`;
    l.innerHTML=[...sel.children].map(c=>c.tagName==='OPTGROUP'?`<div class="dh">${esc(c.label)}</div>`+[...c.children].map(row).join(''):row(c)).join('');
  };
  new MutationObserver(sync).observe(sel,{childList:true});
  b.onclick=e=>{e.stopPropagation();const was=w.classList.contains('open');closeDD();
    if(!was){w.classList.add('open');sync();l.querySelector('.cur')?.scrollIntoView({block:'nearest'})}};
  l.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;
    sel.selectedIndex=+d.dataset.i;sel.dispatchEvent(new Event('change'));closeDD();sync()};
  sync();
}
['#type','#chap','#sort'].forEach(s=>makeDD($(s)));
document.addEventListener('click',closeDD);
applyVars();
load();
</script>
</body>
